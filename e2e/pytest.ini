[pytest]
# Playwright E2E test configuration
addopts =
    --browser chromium
    --screenshot on-failure
    --video retain-on-failure
    --output e2e-results
    -v

# Timeout per test (ms) via pytest-playwright
timeout = 60

# Test discovery
testpaths = .

# Markers
markers =
    e2e: end-to-end browser tests
    slow: tests that take longer due to UI interactions
