# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — TCG Marketplace (backend only)
#
# Frontend is hosted on Vercel — see frontend-next/ for setup instructions.
#
# DEPLOY:
#   Render dashboard → New → Blueprint → pick this repo.
#
# After the first deploy, copy the backend URL from the Render dashboard
# (looks like https://tcg-marketplace-api.onrender.com) and set it as:
#   - CORS_ALLOWED_ORIGINS  → your Vercel frontend URL
#   - CSRF_TRUSTED_ORIGINS  → your Vercel frontend URL
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: tcg-db
    plan: free

services:
  # ── Django REST API ──────────────────────────────────────────────────────────
  - type: web
    name: tcg-marketplace-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        # Leading dot matches *.onrender.com; update to add your Vercel domain too
        value: ".onrender.com,localhost"
      - key: DATABASE_URL
        fromDatabase:
          name: tcg-db
          property: connectionString
      # Update these to your actual Vercel frontend URL after first deploy
      - key: CORS_ALLOWED_ORIGINS
        value: "https://tcg-marketplace.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://tcg-marketplace.vercel.app"
      - key: ACCOUNT_EMAIL_VERIFICATION
        value: "none"
      # Optional — set in Render dashboard for card import / recognition
      - key: POKEMON_TCG_API_KEY
        sync: false
