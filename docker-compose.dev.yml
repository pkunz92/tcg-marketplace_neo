version: '3.8'

# Simple dev stack: postgres + django + next.js
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# First run: seed demo data
#   docker compose -f docker-compose.dev.yml exec backend python manage.py migrate
#   docker compose -f docker-compose.dev.yml exec backend python manage.py seed_demo_data

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: tcg_marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
      DEBUG: "True"
      DB_NAME: tcg_marketplace
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: "5432"
      POKEMON_TCG_API_KEY: ${POKEMON_TCG_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend-next:/app
      - frontend_dev_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  frontend_dev_node_modules:
